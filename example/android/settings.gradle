pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url 'https://storage.googleapis.com/download.flutter.io'
        }
    }

    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '8.9.1' apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ':app'
include ':flutter_audio_query'
project(':flutter_audio_query').projectDir = new File(rootProject.projectDir, 'flutter_audio_query')
include ':flutter_audio_recorder'
project(':flutter_audio_recorder').projectDir = new File(rootProject.projectDir, 'flutter_audio_recorder/android')
include ':assets_audio_player_web'
project(':assets_audio_player_web').projectDir = new File(rootProject.projectDir, 'assets_audio_player_web/android')

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
def properties = new Properties()

assert localPropertiesFile.exists()
localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }

def flutterSdkPath = properties.getProperty("flutter.sdk")
assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
